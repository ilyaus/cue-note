<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cue-note</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- ============ Sidebar: tree ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">cue-note</span>
          <span class="mock-badge" id="mock-badge" hidden>mock</span>
        </div>
        <div class="sidebar-actions">
          <button class="icon-btn" id="palette-btn" title="Command palette (Ctrl+K)" aria-label="Command palette">
            <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M6.5 2A2.5 2.5 0 0 0 4 4.5V6H2.5a2.5 2.5 0 1 0 2.5 2.5V6h6v2.5A2.5 2.5 0 1 0 13.5 6H12V4.5A2.5 2.5 0 1 0 9.5 2h-3zM6 4.5A.5.5 0 0 1 6.5 4h3a.5.5 0 1 1-.5.5V6H6V4.5zM4 8.5a.5.5 0 1 1-.5-.5H4v.5zm8-.5a.5.5 0 1 1-.5.5V8h.5zM6 10h4v1.5A2.5 2.5 0 1 1 7.5 14h1A1.5 1.5 0 1 0 10 12.5V12H6v.5A1.5 1.5 0 1 0 7.5 14h-1A2.5 2.5 0 1 1 6 11.5V10z"/></svg>
          </button>
          <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 1a4 4 0 1 1 0-8 4 4 0 0 1 0 8zM8 0a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-1 0v-1A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-1 0v-1A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1 0-1h1a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1 0-1h1A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-.707.707a.5.5 0 1 1-.707-.707l.707-.707a.5.5 0 0 1 .707 0zm-9.9 9.9a.5.5 0 0 1 0 .708l-.707.707a.5.5 0 0 1-.707-.707l.707-.708a.5.5 0 0 1 .707 0zm9.9.708a.5.5 0 0 1-.707 0l-.707-.707a.5.5 0 0 1 .707-.708l.707.708a.5.5 0 0 1 0 .707zM3.757 3.757a.5.5 0 0 1-.707 0l-.707-.707a.5.5 0 0 1 .707-.707l.707.707a.5.5 0 0 1 0 .707z"/></svg>
            <svg class="icon-moon" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/></svg>
          </button>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>
        <input id="search" type="text" placeholder="Search…" autocomplete="off" />
        <kbd class="search-kbd">/</kbd>
      </div>

      <nav class="tree" id="tree" aria-label="Categories"></nav>

      <div class="sidebar-section">
        <div class="section-head">
          <span>Tags</span>
        </div>
        <div class="tag-cloud" id="tag-cloud"></div>
      </div>

      <div class="sidebar-foot">
        <div class="accent-picker" id="accent-picker" title="Accent color">
          <button class="accent-dot" data-accent="indigo" style="--dot:#5e6ad2" aria-label="Indigo accent"></button>
          <button class="accent-dot" data-accent="violet" style="--dot:#8b5cf6" aria-label="Violet accent"></button>
          <button class="accent-dot" data-accent="blue" style="--dot:#3b82f6" aria-label="Blue accent"></button>
          <button class="accent-dot" data-accent="teal" style="--dot:#14b8a6" aria-label="Teal accent"></button>
          <button class="accent-dot" data-accent="rose" style="--dot:#f43f5e" aria-label="Rose accent"></button>
        </div>
        <span class="api-mode" id="api-mode"></span>
      </div>
    </aside>

    <!-- ============ List pane ============ -->
    <section class="list-pane" id="list-pane">
      <header class="list-head">
        <div class="list-tabs" role="tablist">
          <button class="list-tab active" data-type="all" role="tab">All</button>
          <button class="list-tab" data-type="prompt" role="tab">Prompts</button>
          <button class="list-tab" data-type="note" role="tab">Notes</button>
        </div>
        <div class="list-head-actions">
          <button class="btn btn-primary btn-sm" id="new-btn">
            <svg viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z"/></svg>
            New
          </button>
        </div>
      </header>
      <div class="active-filters" id="active-filters" hidden></div>
      <div class="list-body" id="list-body" role="listbox"></div>
    </section>

    <!-- ============ Detail pane ============ -->
    <section class="detail-pane" id="detail-pane">
      <div id="detail-body" class="detail-body"></div>
    </section>
  </div>

  <!-- ============ Command palette ============ -->
  <div class="palette-overlay" id="palette-overlay" hidden>
    <div class="palette" role="dialog" aria-label="Command palette">
      <div class="palette-input-wrap">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>
        <input id="palette-input" type="text" placeholder="Type a command or search…" autocomplete="off" />
        <kbd>esc</kbd>
      </div>
      <div class="palette-results" id="palette-results"></div>
    </div>
  </div>

  <!-- ============ Modal ============ -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" id="modal"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
