<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cue-note</title>
  <link rel="stylesheet" href="app.css" />
  <script>
    (function () {
      var t = localStorage.getItem("cue-note-theme");
      if (!t || t === "auto") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="workspace-name"><span class="workspace-icon">&#128220;</span> cue-note</div>
        <button class="icon-btn" id="theme-toggle" title="Switch theme">&#9681;</button>
      </div>
      <div class="sidebar-search">
        <input type="search" id="search-input" placeholder="Search&hellip;  ( / )" autocomplete="off" />
      </div>
      <nav class="sidebar-scroll">
        <div class="tree" id="tree" role="tree" aria-label="Workspace tree"></div>
        <div class="sidebar-section" id="tag-section">
          <div class="sidebar-section-title">Tags</div>
          <div class="tag-filters" id="tag-filters"></div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-new-btn" id="new-prompt-btn">+ New prompt</button>
        <button class="sidebar-new-btn" id="new-note-btn">+ New note</button>
        <button class="sidebar-new-btn" id="new-category-btn">+ New category</button>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">&#9776;</button>
        <nav class="breadcrumb" id="breadcrumb"></nav>
        <div class="topbar-spacer"></div>
        <span class="mode-badge" id="mode-badge" hidden></span>
        <button class="icon-btn" id="palette-btn" title="Command palette (Ctrl+K)">&#8984;K</button>
      </header>
      <div class="canvas-wrap" id="canvas-wrap">
        <div id="canvas" class="canvas"></div>
      </div>
    </main>
  </div>

  <div class="palette-overlay" id="palette-overlay" hidden>
    <div class="palette" role="dialog" aria-label="Command palette">
      <input type="text" id="palette-input" placeholder="Type a command or search&hellip;" autocomplete="off" />
      <ul class="palette-results" id="palette-results"></ul>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal" role="dialog"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
