<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cue-note</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>cue-note</h1>
      <nav class="tabs">
        <button type="button" class="tab" data-kind="prompts" aria-pressed="true">Prompts</button>
        <button type="button" class="tab" data-kind="notes" aria-pressed="false">Notes</button>
      </nav>
      <span id="status" class="status" role="status"></span>
    </header>

    <main>
      <section class="sidebar">
        <form id="filters" autocomplete="off">
          <input type="search" id="q" placeholder="Search text…" />
          <input type="text" id="tag-filter" placeholder="Filter by tags (comma separated)" />
          <div class="row">
            <button type="submit">Apply</button>
            <button type="reset" id="clear-filters">Clear</button>
          </div>
        </form>
        <div class="row">
          <button type="button" id="new-record">New</button>
          <span id="count" class="count"></span>
        </div>
        <ul id="list" class="list"></ul>
        <div class="tag-cloud">
          <h2>Tags in use</h2>
          <ul id="tag-cloud"></ul>
        </div>
      </section>

      <section class="editor">
        <form id="record-form" autocomplete="off">
          <input type="hidden" id="record-id" />

          <label>
            <span id="title-label">Name</span>
            <input type="text" id="title" required />
          </label>

          <label>
            <span>Tags (comma separated)</span>
            <input type="text" id="tags" />
          </label>

          <label id="variables-field">
            <span>Variables (comma separated placeholder names)</span>
            <input type="text" id="variables" />
          </label>

          <label id="prompt-link-field" hidden>
            <span>Linked prompt</span>
            <select id="prompt-id">
              <option value="">— none —</option>
            </select>
          </label>

          <label>
            <span id="body-label">Body / template text</span>
            <textarea id="body" rows="18"></textarea>
          </label>

          <div class="row">
            <button type="submit" id="save">Save</button>
            <button type="button" id="delete" hidden>Delete</button>
            <span id="meta" class="meta"></span>
          </div>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
